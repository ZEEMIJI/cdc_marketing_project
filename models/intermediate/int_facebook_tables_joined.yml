version: 2

models:
  - name: int_facebook_tables__joined
    description: "Facebook ads enriched with campaign name and account currency. One row per ad per day."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ad_id, ad_date]
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_facebook_ads_stats')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ad_clicks <= ad_impressions"
    columns:
      - name: ad_id
        description: "Facebook ad ID. Part of the row's unique key."
        data_tests:
          - not_null
      - name: ad_date
        description: "Day the stats apply to. Part of the row's unique key."
        data_tests:
          - not_null
      - name: ad_spend
        description: "Spend in the ad account's currency (see ad_currency_code). Do not sum across currencies."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: ad_impressions
        description: "Impressions served that day. Nulls in the source are set to 0."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: ad_clicks
        description: "Clicks that day. Nulls in the source are set to 0."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: campaign_id
        description: "Campaign the ad belongs to."
        data_tests:
          - not_null
      - name: campaign_name
        description: "Campaign name."
        data_tests:
          - not_null
      - name: ad_currency_code
        description: "Currency of the ad account that spend is reported in."
        data_tests:
          - not_null